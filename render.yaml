services:
  - type: web
    name: esl-platform
    env: python
    plan: free
    # NOTE: tools/restore_pm91_submissions.py is INTENTIONALLY removed from the
    # build chain. It hardcodes scores (80/75/100) for 3 PM 91 students and
    # re-creates them on every active PM 91 assignment, which fabricated
    # phantom submissions on every new homework. The script is now env-var
    # guarded — if you ever need to re-run it for a one-off restore, set
    # ALLOW_PM91_RESTORE=1 in the Render dashboard and trigger a deploy.
    buildCommand: pip install -r requirements.txt && python tools/seed_db.py && python tools/seed_book1.py && python tools/seed_book2_words.py && python tools/seed_book2_units6_8.py && python tools/seed_book2_units10_15.py && python tools/seed_book2_units16_17_19_20.py && python tools/seed_book2_unit9_real.py && python tools/seed_book2_unit18.py && python tools/seed_book2_unit21.py && python tools/seed_book2_unit22.py && python tools/seed_book2_unit23.py && python tools/seed_book2_unit24.py && python tools/seed_book2_unit25.py && python tools/seed_book2_unit26.py && python tools/seed_book2_unit27.py && python tools/seed_book2_unit28.py && python tools/seed_book2_unit29.py && python tools/seed_book2_unit30.py && python tools/seed_book3.py && python tools/seed_stories.py 3 && python tools/migrate_class_homework.py && python tools/reset_submissions.py && python tools/seed_students.py && python tools/seed_reading_hw.py && python tools/seed_b1_reading_work.py && python tools/link_existing_images.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: esl-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Set these manually in the Render dashboard after deploy:
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: esl-db
    plan: free             # free tier — upgrade to 'basic' ($7/mo) for no expiry
    databaseName: esl
    user: esl_user
